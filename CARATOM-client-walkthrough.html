<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CARATOM — Phone UI walkthrough</title>
  <style>
    :root {
      --tint: #0e3d2c;
      --tint-2: #1a6b4a;
      --orange: #e07a3d;
      --ios-bg: #f2f2f7;
      --ios-card: #ffffff;
      --ios-sep: #c6c6c8;
      --ios-label: #1c1c1e;
      --ios-sec: #8e8e93;
      --ios-blue: #0e3d2c;
      --danger: #ff3b30;
      --ok: #34c759;
      --page: #1a1d1b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--page);
      color: #eee;
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
    .lede { color: #9aa39c; font-size: 14px; margin: 8px 0 18px; max-width: 56ch; }

    .faces { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .faces button, .chips button {
      font: inherit; cursor: pointer; border: 0; border-radius: 999px;
      padding: 8px 14px; background: #2a2f2c; color: #ddd;
    }
    .faces button.on { background: #e8efe9; color: #111; font-weight: 600; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 14px; }
    .chips button { white-space: nowrap; font-size: 12px; padding: 6px 11px; }
    .chips button.on { background: var(--tint-2); color: #fff; }

    .stage {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }

    /* Device */
    .device {
      width: 375px;
      height: 780px;
      background: #0a0a0a;
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 0 0 3px #2c2c2c, 0 24px 60px rgba(0,0,0,.5);
      position: relative;
    }
    .device::before {
      content: "";
      position: absolute;
      top: 18px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 34px; background: #000; border-radius: 20px; z-index: 5;
    }
    .screen {
      height: 100%;
      background: var(--ios-bg);
      border-radius: 38px;
      overflow: hidden;
      position: relative;
      color: var(--ios-label);
      display: flex;
      flex-direction: column;
    }
    .sb {
      height: 54px;
      padding: 14px 22px 0;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 10px; min-height: 44px; flex-shrink: 0;
    }
    .nav h2 { font-size: 17px; font-weight: 650; }
    .nav .back, .nav .right {
      font-size: 16px; color: var(--tint); background: none; border: 0; cursor: pointer;
      min-width: 64px;
    }
    .nav .right { text-align: right; font-size: 15px; }
    .scroll { flex: 1; overflow-y: auto; padding: 0 16px 12px; }
    .scroll::-webkit-scrollbar { width: 0; }

    .tabbar {
      flex-shrink: 0;
      height: 72px;
      background: rgba(255,255,255,.92);
      border-top: 0.5px solid var(--ios-sep);
      display: flex;
      padding-bottom: 16px;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: 10px; color: var(--ios-sec); background: none; border: 0; cursor: pointer;
    }
    .tab.on { color: var(--tint); font-weight: 600; }
    .tab svg { width: 22px; height: 22px; }

    .home-ind {
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 5px; background: #111; border-radius: 4px; z-index: 6;
    }

    /* UI bits */
    .large { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; padding: 4px 0 12px; }
    .card {
      background: var(--ios-card); border-radius: 12px; padding: 14px;
      margin-bottom: 12px;
    }
    .card h3 { font-size: 15px; margin-bottom: 6px; }
    .muted { color: var(--ios-sec); font-size: 13px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; background: #e8eee9; color: var(--tint);
      font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    }
    .chip.warn { background: #fff1e6; color: var(--orange); }
    .chip.ok { background: #e4f8ea; color: #1b7a38; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .cell {
      background: var(--ios-card); border-radius: 12px; padding: 10px 12px;
    }
    .cell label { display: block; font-size: 11px; color: var(--ios-sec); }
    .cell b { font-size: 14px; font-weight: 600; }
    .pkg {
      background: var(--ios-card); border-radius: 14px; padding: 14px; margin-bottom: 10px;
      border: 1px solid transparent;
    }
    .pkg.sel { border-color: var(--tint); background: #f3faf6; }
    .pkg .price { color: var(--tint); font-weight: 700; font-size: 15px; margin-top: 4px; }
    .btn {
      width: 100%; border: 0; border-radius: 14px; padding: 14px;
      background: var(--tint); color: #fff; font-weight: 650; font-size: 16px;
      margin-top: 8px; cursor: pointer;
    }
    .btn.sec { background: #e8eee9; color: var(--tint); }
    .btn.ghost { background: transparent; color: var(--danger); }
    .list { background: var(--ios-card); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    .li {
      padding: 13px 14px; border-bottom: 0.5px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 16px;
    }
    .li:last-child { border-bottom: 0; }
    .li .chev { color: #c7c7cc; }
    .seg {
      display: flex; background: #e5e5ea; border-radius: 9px; padding: 2px; margin-bottom: 12px;
    }
    .seg span {
      flex: 1; text-align: center; font-size: 13px; font-weight: 600; padding: 6px;
      border-radius: 7px; color: #3a3a3c;
    }
    .seg span.on { background: #fff; }
    .map {
      height: 160px; border-radius: 12px; margin-bottom: 12px;
      background:
        linear-gradient(90deg, #dfe8e2 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(#dfe8e2 1px, transparent 1px) 0 0 / 24px 24px,
        #eef3ef;
      position: relative; overflow: hidden;
    }
    .road {
      position: absolute; height: 10px; background: #c5d0c8; top: 72px; left: 0; right: 0;
    }
    .pin {
      position: absolute; width: 18px; height: 18px; background: var(--tint);
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      left: 58%; top: 48%;
    }
    .van {
      position: absolute; left: 22%; top: 64px; width: 28px; height: 16px;
      background: var(--orange); border-radius: 3px;
    }
    .stars { letter-spacing: 4px; font-size: 28px; color: #d1d1d6; }
    .stars .on { color: var(--orange); }
    .photo {
      height: 88px; border-radius: 10px; background: #dce6df;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--tint); font-weight: 600;
    }
    .banner {
      background: var(--tint); color: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px;
    }
    .explain h2 { font-size: 20px; margin-bottom: 8px; }
    .explain p { color: #b7c0b9; font-size: 14px; line-height: 1.5; }
    .search {
      background: #e5e5ea; border-radius: 10px; padding: 10px 12px; font-size: 15px; color: #636366;
      margin-bottom: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
  </style>
</head>
<body>

function sb() {
  return `<div class="sb"><span>9:41</span><span>●●●● LTE</span></div>`;
}
function nav(title, back, right) {
  return `<div class="nav"><span class="back">${back || ""}</span><h2>${title}</h2><span class="right">${right || ""}</span></div>`;
}
function tabs(face, active) {
  const t = apps[face].tabs;
  return `<div class="tabbar">${t.map(x => `<button class="tab ${x.id===active?"on":""}">${I[x.icon]}<span>${x.label}</span></button>`).join("")}</div>`;
}
function shell(face, title, body, tab, {back="‹", right=""}={}) {
  return `${sb()}${nav(title, back, right)}<div class="scroll">${body}</div>${tabs(face, tab)}`;
}

let face = "customer";
let screen = "home";

function render() {

  ).join("");
  document.querySelectorAll("#faces button").forEach(b => b.onclick = () => {
    face = b.dataset.f; screen = apps[face].screens[0][0]; render();
  });
  document.getElementById("chips").innerHTML = apps[face].screens.map(([id,l]) =>
    `<button class="${screen===id?"on":""}" data-s="${id}">${l}</button>`
  ).join("");
  document.querySelectorAll("#chips button").forEach(b => b.onclick = () => { screen = b.dataset.s; render(); });
  document.getElementById("screen").innerHTML = ui[face][screen]();
  const c = copy[face][screen];
  document.getElementById("explain").innerHTML = `<h2>${c[0]}</h2><p>${c[1]}</p>`;
}
